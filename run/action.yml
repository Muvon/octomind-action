name: 'Octomind Run'
description: 'Run an Octomind AI agent in your GitHub Actions workflows'
author: 'Muvon Un Limited'

branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  prompt:
    description: 'Task or message to send to octomind'
    required: true
  role:
    description: 'Role to use (e.g. developer:rust). Defaults to config default'
    required: false
  model:
    description: 'Model override (e.g. openrouter:anthropic/claude-sonnet-4)'
    required: false
  name:
    description: 'Session name — creates or resumes a named session'
    required: false
  resume:
    description: 'Resume a specific session by name'
    required: false
  resume_recent:
    description: 'Resume the most recent session for the current directory'
    required: false
    default: 'false'
  sandbox:
    description: 'Restrict filesystem writes to the current working directory'
    required: false
    default: 'false'
  hook:
    description: 'Comma-separated webhook hook names to activate'
    required: false
  version:
    description: 'Octomind version to install (default: latest)'
    required: false
    default: 'latest'
  tap:
    description: 'Tap to add before run (e.g. "user/repo" or "user/repo ./local/path")'
    required: false
  config:
    description: 'Path to octomind config file'
    required: false
  comment:
    description: 'PR comment mode: full (direct post), compact (collapsible), none (no comment)'
    required: false
    default: 'none'
  github_token:
    description: 'GitHub token for PR commenting'
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: 'Last assistant message content'
    value: ${{ steps.core.outputs.result }}
  session_id:
    description: 'Session ID for resuming in subsequent steps'
    value: ${{ steps.core.outputs.session_id }}
  cost:
    description: 'Session cost as JSON (tokens, cost)'
    value: ${{ steps.core.outputs.cost }}
  raw_output:
    description: 'Full JSONL output for advanced parsing'
    value: ${{ steps.core.outputs.raw_output }}
  exit_code:
    description: 'Process exit code'
    value: ${{ steps.core.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - id: core
      uses: muvon/octomind-action/_core@v1
      with:
        command: run
        prompt: ${{ inputs.prompt }}
        role: ${{ inputs.role }}
        model: ${{ inputs.model }}
        name: ${{ inputs.name }}
        resume: ${{ inputs.resume }}
        resume_recent: ${{ inputs.resume_recent }}
        sandbox: ${{ inputs.sandbox }}
        hook: ${{ inputs.hook }}
        version: ${{ inputs.version }}
        tap: ${{ inputs.tap }}
        config: ${{ inputs.config }}
        comment: ${{ inputs.comment }}
        github_token: ${{ inputs.github_token }}
