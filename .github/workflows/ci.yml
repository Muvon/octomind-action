name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    name: Validate actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in action.yml run/action.yml workflow/action.yml _core/action.yml README.md LICENSE; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          echo "All required files present"

      - name: Validate action metadata
        run: |
          for f in action.yml run/action.yml workflow/action.yml _core/action.yml; do
            grep -q '^name:' "$f" || { echo "$f: missing name"; exit 1; }
            grep -q '^description:' "$f" || { echo "$f: missing description"; exit 1; }
            grep -q "using: 'composite'" "$f" || { echo "$f: not a composite action"; exit 1; }
          done
          # Public facades expose prompt/input and delegate to the shared engine
          grep -q '  prompt:' action.yml || { echo "root: missing prompt input"; exit 1; }
          grep -q '  prompt:' run/action.yml || { echo "run: missing prompt input"; exit 1; }
          grep -q '  input:' workflow/action.yml || { echo "workflow: missing input"; exit 1; }
          grep -q 'octomind-action/_core@' action.yml || { echo "root: not wired to _core"; exit 1; }
          grep -q 'octomind-action/_core@' run/action.yml || { echo "run: not wired to _core"; exit 1; }
          grep -q 'octomind-action/_core@' workflow/action.yml || { echo "workflow: not wired to _core"; exit 1; }
          grep -q '  command:' _core/action.yml || { echo "_core: missing command input"; exit 1; }
          echo "Action metadata OK"

  test-run:
    name: Test run (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04        # x86_64 Linux
          - ubuntu-24.04-arm    # aarch64 Linux
          - macos-15            # aarch64 macOS (M-series)
          - macos-15-intel      # x86_64 macOS (Intel)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Test the shared engine directly — the public facades reference
      # muvon/octomind-action/_core@v1, which only resolves after a release,
      # so CI exercises ./_core on the checked-out code instead.
      - name: Run octomind (run)
        id: octomind
        uses: ./_core
        with:
          command: run
          prompt: "say hi"
          role: assistant:general
          model: ollama:minimax-m2.7
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      - name: Verify outputs
        shell: bash
        run: |
          echo "Exit code: ${{ steps.octomind.outputs.exit_code }}"
          echo "Result: ${{ steps.octomind.outputs.result }}"
          echo "Session: ${{ steps.octomind.outputs.session_id }}"
          echo "Cost: ${{ steps.octomind.outputs.cost }}"
          test "${{ steps.octomind.outputs.exit_code }}" = "0"

  test-workflow:
    name: Test workflow
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Write smoke workflow
        shell: bash
        run: |
          cat > /tmp/ci-workflow.toml <<'TOML'
          name = "ci-smoke"

          [[steps]]
          name   = "greet"
          role   = "assistant:general"
          model  = "ollama:minimax-m2.7"
          prompt = "Reply with a short greeting to: {{input}}"
          TOML

      - name: Run octomind (workflow)
        id: wf
        uses: ./_core
        with:
          command: workflow
          workflow_file: /tmp/ci-workflow.toml
          prompt: "the CI pipeline"
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      - name: Verify outputs
        shell: bash
        run: |
          echo "Exit code: ${{ steps.wf.outputs.exit_code }}"
          echo "Result: ${{ steps.wf.outputs.result }}"
          echo "Cost: ${{ steps.wf.outputs.cost }}"
          test "${{ steps.wf.outputs.exit_code }}" = "0"
          test -n "${{ steps.wf.outputs.result }}"
