name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    name: Validate action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f action.yml || { echo "Missing action.yml"; exit 1; }
          test -f README.md || { echo "Missing README.md"; exit 1; }
          test -f LICENSE || { echo "Missing LICENSE"; exit 1; }
          echo "All required files present"

      - name: Validate action.yml structure
        run: |
          grep -q '^name:' action.yml || { echo "Missing name"; exit 1; }
          grep -q '^description:' action.yml || { echo "Missing description"; exit 1; }
          grep -q '^branding:' action.yml || { echo "Missing branding"; exit 1; }
          grep -q '  prompt:' action.yml || { echo "Missing prompt input"; exit 1; }
          grep -q "using: 'composite'" action.yml || { echo "Not a composite action"; exit 1; }
          echo "Action structure OK"

  test-run:
    name: Test (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04        # x86_64 Linux
          - ubuntu-24.04-arm    # aarch64 Linux
          - macos-15            # aarch64 macOS (M-series)
          - macos-15-intel      # x86_64 macOS (Intel)
          - windows-2025        # x86_64 Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run action
        id: octomind
        uses: ./
        with:
          prompt: "say hi"
          role: assistant:general
          model: ollama:minimax-m2.7
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      - name: Verify outputs
        shell: bash
        run: |
          echo "Exit code: ${{ steps.octomind.outputs.exit_code }}"
          echo "Result: ${{ steps.octomind.outputs.result }}"
          echo "Session: ${{ steps.octomind.outputs.session_id }}"
          echo "Cost: ${{ steps.octomind.outputs.cost }}"
          test "${{ steps.octomind.outputs.exit_code }}" = "0"
